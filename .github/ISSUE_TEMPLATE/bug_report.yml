name: Bug report
description: Report a reproducible problem in OpenTopia
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove credentials,
        private source code, and personal data from screenshots and logs.

        For security vulnerabilities, stop here and follow
        [SECURITY.md](https://github.com/StagoMax/OpenTopia/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets and private data from this report.
          required: true

  - type: input
    id: revision
    attributes:
      label: OpenTopia revision
      description: Commit SHA, branch, or build identifier.
      placeholder: "main at abc1234"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: Use "mock provider" if no external provider is involved. Never include an API key.
      placeholder: "Mock provider / not provider-specific"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact in a few sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Start OpenTopia with ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Drag files here after removing secrets and private data. Include sandbox mode if execution is involved.

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Unknown
    validations:
      required: true
