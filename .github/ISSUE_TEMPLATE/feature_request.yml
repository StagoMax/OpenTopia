name: Feature request
description: Propose a focused improvement to OpenTopia
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Good proposals start with the user problem. Large architectural changes,
        provider integrations, and security-boundary changes should be discussed
        here before implementation begins.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find the same proposal.
          required: true
        - label: I have described the problem independently from my preferred solution.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who experiences the problem, in which workflow, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation or interaction ideas.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workflows, workarounds, or designs you considered.

  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Note UI, compatibility, migration, security, sandbox, provider, or performance implications.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be able to implement this after the design is agreed.
