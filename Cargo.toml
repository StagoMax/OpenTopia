[workspace]
resolver = "2"
members = [
  "crates/opentopia-core",
  "crates/opentopia-sandbox-protocol",
  "crates/opentopia-server",
  "crates/opentopia-cli",
  "crates/opentopia-windows-sandbox",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/StagoMax/OpenTopia"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "0.8", features = ["chrono", "derive", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
png = "0.17"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ErrorReporting",
  "Win32_System_JobObjects",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Rpc",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
